<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .icon-bg { fill: #1a1a1a; }
      .clock-rim { fill: #3b82f6; }
      .hour-marker { fill: #3b82f6; }
      .orange-graph { fill: none; stroke: #f97316; stroke-width: 4; stroke-linecap: round; }
      .green-graph { fill: none; stroke: #22c55e; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- 背景 -->
  <rect width="256" height="256" class="icon-bg"/>
  
  <!-- 时钟外圈 -->
  <circle cx="128" cy="128" r="100" class="clock-rim"/>
  
  <!-- 时钟刻度 -->
  <g class="hour-marker">
    <!-- 12点 -->
    <rect x="124" y="20" width="8" height="16" rx="4"/>
    <!-- 3点 -->
    <rect x="220" y="124" width="16" height="8" rx="4"/>
    <!-- 6点 -->
    <rect x="124" y="220" width="8" height="16" rx="4"/>
    <!-- 9点 -->
    <rect x="20" y="124" width="16" height="8" rx="4"/>
    <!-- 其他刻度 -->
    <rect x="190" y="50" width="6" height="12" rx="3" transform="rotate(30 193 56)"/>
    <rect x="190" y="194" width="6" height="12" rx="3" transform="rotate(150 193 200)"/>
    <rect x="50" y="50" width="6" height="12" rx="3" transform="rotate(210 53 56)"/>
    <rect x="50" y="194" width="6" height="12" rx="3" transform="rotate(330 53 200)"/>
    <rect x="220" y="80" width="6" height="12" rx="3" transform="rotate(60 223 86)"/>
    <rect x="220" y="164" width="6" height="12" rx="3" transform="rotate(120 223 170)"/>
    <rect x="36" y="80" width="6" height="12" rx="3" transform="rotate(240 39 86)"/>
    <rect x="36" y="164" width="6" height="12" rx="3" transform="rotate(300 39 170)"/>
  </g>
  
  <!-- 橙色趋势线 -->
  <path class="orange-graph" d="M 60 180 Q 80 160 100 140 Q 120 120 140 100 Q 160 80 180 60 Q 200 40 220 20" stroke-dasharray="none"/>
  
  <!-- 绿色趋势线 -->
  <path class="green-graph" d="M 60 200 Q 80 190 100 180 Q 120 170 140 160 Q 160 150 180 140 Q 200 130 220 120" stroke-dasharray="none"/>
  
  <!-- 箭头指示器 -->
  <polygon points="210,30 220,20 220,40" fill="#f97316"/>
  <polygon points="210,110 220,100 220,120" fill="#22c55e"/>
</svg>