<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VisualVM Client Icon">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#g1)" filter="url(#shadow)"/>

  <!-- Stylized VM mark: V + M composed -->
  <g transform="translate(68,140)">
    <!-- V -->
    <path d="M0 16 L40 16 L88 216 L72 216 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M176 16 L136 16 L88 216 L104 216 Z" fill="#e2e8f0" opacity="0.95"/>

    <!-- M -->
    <path d="M216 16 L256 16 L296 120 L336 16 L376 16 L376 216 L344 216 L344 96 L296 200 L248 96 L248 216 L216 216 Z" fill="url(#g2)"/>
  </g>

  <!-- Pulse ring to imply monitoring -->
  <g opacity="0.18">
    <circle cx="256" cy="256" r="172" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="256" cy="256" r="206" fill="none" stroke="#ffffff" stroke-width="6"/>
  </g>

  <!-- Small dot indicator -->
  <circle cx="388" cy="140" r="10" fill="#10b981"/>
</svg>


